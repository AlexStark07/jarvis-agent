[project]
name = "jarvis-agent"
version = "0.1.0"
description = "A voice-first, multi-agent AI operating system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "langgraph>=0.0.1",
    "docker>=6.0.0",
    "python-multipart>=0.0.6",
    "openai>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio",
    "httpx",
]
